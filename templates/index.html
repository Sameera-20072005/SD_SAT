
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuickBasket Grocery Store</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h2>🛒 QuickBasket</h2>
    <span>Fresh groceries, delivered fast</span>
    <button onclick="document.getElementById('cart').scrollIntoView()">
        Cart (<span id="count">0</span>)
    </button>
</header>

<main>
    <section class="hero">
        <h1>Your Daily Groceries, Made Simple!</h1>
        <p>Search, shop, order and track your groceries.</p>
    </section>

    <section>
        <h2>Available Products</h2>
        <input id="search" placeholder="Search groceries...">
        <div id="products" class="grid"></div>
        <p id="message"></p>
    </section>

    <section id="cart">
        <h2>🛍️ Your Cart</h2>
        <div id="cart-items"></div>
        <h3>Total: ₹<span id="total">0</span></h3>
        <button id="checkout" onclick="placeOrder()">
            Place Order
        </button>
    </section>

    <section>
        <h2>📦 Track Your Order</h2>
        <input id="order-id" placeholder="Enter Order ID (e.g. O101)">
        <button onclick="trackOrder()">Track Order</button>
        <div id="tracking"></div>
    </section>
</main>

<footer>
    QuickBasket | Food & Grocery Quick-Commerce Project
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
